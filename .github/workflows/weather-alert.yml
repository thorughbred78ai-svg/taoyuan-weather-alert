name: 桃園氣象特報監控

on:
  schedule:
    # 每小時第 10 分鐘執行
    # 使用 Asia/Taipei，不需要自己換算 UTC
    - cron: "10 * * * *"
      timezone: "Asia/Taipei"

  # 可以在 GitHub Actions 頁面手動執行
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taoyuan-weather-alert
  cancel-in-progress: false

jobs:
  weather-alert:
    name: CWA 桃園氣象特報監控
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weather alert monitor
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Redis URL，例如：
          # redis://default:password@hostname:6379/0
          #
          # 或 TLS：
          # rediss://default:password@hostname:6379/0
          REDIS_URL: ${{ secrets.REDIS_URL }}

          REDIS_KEY: weather:alert:taoyuan
        run: |
          python src/weather_alert.py
